# nginx del contenedor `web`: el mismo sitio de docs/DESPLIEGUE.md §2.5, con el
# backend en el servicio `backend` y los volúmenes montados en /static y /media.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # RG-006: TLS 1.2 o superior
    ssl_certificate     /etc/nginx/certs/sigecue.crt;
    ssl_certificate_key /etc/nginx/certs/sigecue.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6M;   # RNF-005: 5 MB por archivo
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location /static/ { alias /static/; }

    # Imágenes públicas. Los archivos de los aspirantes (MEDIA_ROOT) NO se
    # publican: solo los entrega la API con control de acceso.
    location /media/ { alias /media/; }

    # /admin es el panel de React: no se envía a Django.
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier otra ruta la resuelve React.
    location / {
        try_files $uri /index.html;
    }
}
