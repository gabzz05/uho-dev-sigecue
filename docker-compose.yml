# SIGECUE en contenedores (RG-021, RE-007, RNF-010, criterio de aceptación 15).
#
#   cp .env.example .env
#   docker compose run --rm --no-deps backend claves   # pegar el resultado en .env
#   docker compose up -d --build
#
# Detalle en docs/DOCKER.md.

# worker y beat usan la misma imagen que backend (solo backend la construye).
x-backend: &backend
  image: sigecue-backend
  pull_policy: never
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "False"
    MEDIA_ROOT: /data/media
    PUBLIC_MEDIA_ROOT: /data/media_publica
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigecue}
      POSTGRES_USER: ${POSTGRES_USER:-sigecue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    build: ./backend
    pull_policy: build
    volumes:
      - media:/data/media
      - media_publica:/data/media_publica
      - static:/app/staticfiles
      - logs:/app/logs

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - media:/data/media
      - media_publica:/data/media_publica
      - logs:/app/logs

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    volumes:
      - logs:/app/logs

  web:
    build: ./frontend
    image: sigecue-web
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - static:/static:ro
      - media_publica:/media:ro
      # Certificado de la UHO: copiar sigecue.crt y sigecue.key a ./certs.
      # Sin ellos se genera uno autofirmado para pruebas.
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
  media_publica:
  static:
  logs:
